[access_config]
api_key: YOUR_TWITTER_API_KEY_HERE
api_secret: YOUR_TWITTER_API_SECRET_HERE  
access_token: YOUR_TWITTER_ACCESS_TOKEN_HERE
token_secret: YOUR_TWITTER_TOKEN_SECRET_HERE

[general]
basedir: /path/to/gettor/twitter
mirrors: /path/to/mirrors-list.txt
core_cfg: /path/to/core.cfg

[blacklist]
cfg: /path/to/blacklist.cfg
max_requests: 3
wait_time: 20

[i18n]
dir: /path/to/lang/

[log]
level: DEBUG
dir: /path/to/log/