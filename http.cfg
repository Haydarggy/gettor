[general]
basedir: /path/to/gettor/http
mirrors: /path/to/mirrors-list.txt
core_cfg: /path/to/core.cfg

[http]
host: 0.0.0.0
port: 8080
ssl: false
ssl_cert: /path/to/ssl.crt
ssl_key: /path/to/ssl.key

[blacklist]
cfg: /path/to/blacklist.cfg
max_requests: 3
wait_time: 20

[i18n]
dir: /path/to/lang/

[log]
level: DEBUG
dir: /path/to/log/